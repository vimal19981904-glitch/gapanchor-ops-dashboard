<svg viewBox="0 0 940 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for the line -->
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B5BDB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Logo Text -->
  <g>
    <!-- "Gap" in dark navy -->
    <text x="80" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0F172A">Gap</text>
    
    <!-- "Anchor" in dark navy with first letter in purple -->
    <text x="260" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0F172A">nchor</text>
    
    <!-- "A" in purple -->
    <text x="235" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#7C3AED">A</text>
  </g>

  <!-- Vertical separator line -->
  <line x1="545" y1="65" x2="545" y2="125" stroke="#7C3AED" stroke-width="3"/>

  <!-- Tagline -->
  <text x="570" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#000">Let's bridge the gap together.</text>

  <!-- Gradient line underneath -->
  <rect x="80" y="150" width="380" height="4" fill="url(#lineGradient)" rx="2"/>
</svg>
